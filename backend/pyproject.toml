[project]
name = "bhasha"
version = "0.1.0"
description = "Self-hosted language learning backend: learner model, FSRS reviews, level-matched reading"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "fsrs>=6.0,<7",
    "jieba>=0.42",
    "pypinyin>=0.53",
    "httpx>=0.27",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"app.packs.zh" = ["*.txt"]
