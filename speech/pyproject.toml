[project]
name = "bhasha-speech"
version = "0.1.0"
description = "Text-to-speech service for bhasha. Runs on any host bhasha can reach: the homelab (CPU) or a GPU PC."
requires-python = ">=3.10,<3.13"  # Kokoro supports up to 3.12
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "pypinyin>=0.53",
]

[project.optional-dependencies]
# Install PyTorch first (CPU or CUDA build), then: pip install -e ".[kokoro]"
kokoro = ["kokoro>=0.9.4,<1", "misaki[zh]>=0.9.4,<1"]  # Python 3.10-3.12
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bhasha_speech*"]
