# api + worker + postgres. The worker runs queued jobs (text generation) from a
# Postgres table; the speech service arrives with TTS. See docs/design.md "Architecture".
name: bhasha

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      BHASHA_DATABASE_URL: postgresql+psycopg://bhasha:${POSTGRES_PASSWORD:?set in .env}@db:5432/bhasha
      BHASHA_TIMEZONE: ${BHASHA_TIMEZONE:-UTC}
      BHASHA_SECRET_KEY: ${BHASHA_SECRET_KEY:-}
      BHASHA_LLM_MAX_CALLS_PER_DAY: ${BHASHA_LLM_MAX_CALLS_PER_DAY:-300}
      BHASHA_SPEECH_URLS: ${BHASHA_SPEECH_URLS:-http://speech:8790}
      BHASHA_SPEECH_TOKEN: ${BHASHA_SPEECH_TOKEN:?set in .env}
      BHASHA_AUDIO_CACHE_DIR: /srv/audio
      # Importer: hosts on your LAN that links may point to, and your Jellyfin for subtitles.
      BHASHA_IMPORT_ALLOW_HOSTS: ${BHASHA_IMPORT_ALLOW_HOSTS:-}
      BHASHA_JELLYFIN_URL: ${BHASHA_JELLYFIN_URL:-}
      BHASHA_JELLYFIN_API_KEY: ${BHASHA_JELLYFIN_API_KEY:-}
    volumes:
      - ./data:/data:ro           # source datasets for the importers
      - audio:/srv/audio          # synthesized speech cache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BHASHA_PORT:-8000}:8000"
    labels:
      # Behind an existing Traefik: set TRAEFIK_ENABLE=true and BHASHA_HOST in .env,
      # and attach this service to Traefik's network (see docker-compose.traefik.yml).
      - traefik.enable=${TRAEFIK_ENABLE:-false}
      - traefik.http.routers.bhasha.rule=Host(`${BHASHA_HOST:-bhasha.localhost}`)
      - traefik.http.routers.bhasha.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.bhasha.tls=true
      - traefik.http.services.bhasha.loadbalancer.server.port=8000

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker   # adds CPU PyTorch for the nightly FSRS optimizer
    restart: unless-stopped
    environment:
      BHASHA_DATABASE_URL: postgresql+psycopg://bhasha:${POSTGRES_PASSWORD:?set in .env}@db:5432/bhasha
      BHASHA_TIMEZONE: ${BHASHA_TIMEZONE:-UTC}
      BHASHA_SECRET_KEY: ${BHASHA_SECRET_KEY:-}
      BHASHA_LLM_MAX_CALLS_PER_DAY: ${BHASHA_LLM_MAX_CALLS_PER_DAY:-300}
      BHASHA_SPEECH_URLS: ${BHASHA_SPEECH_URLS:-http://speech:8790}
      BHASHA_SPEECH_TOKEN: ${BHASHA_SPEECH_TOKEN:?set in .env}
      BHASHA_AUDIO_CACHE_DIR: /srv/audio
    volumes:
      - audio:/srv/audio
    depends_on:
      api:
        condition: service_healthy   # the api runs the migrations first
    healthcheck:
      disable: true
    stop_grace_period: 90s          # lets a running generation finish

  # Text-to-speech on the homelab's CPU (Kokoro). A GPU PC can run the same service
  # (speech/windows/README.md): list it first in BHASHA_SPEECH_URLS and this one
  # becomes the fallback when the PC is off.
  speech:
    build: ./speech
    restart: unless-stopped
    environment:
      SPEECH_ENGINE: ${SPEECH_ENGINE:-kokoro}
      SPEECH_DEVICE: cpu
      SPEECH_TOKEN: ${BHASHA_SPEECH_TOKEN:?set in .env}
      KOKORO_REPO: ${KOKORO_REPO:-hexgrad/Kokoro-82M}
    volumes:
      - speech-models:/models     # Kokoro weights, downloaded once
    stop_grace_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bhasha
      POSTGRES_DB: bhasha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhasha -d bhasha"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  audio:
  speech-models:
